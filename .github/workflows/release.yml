name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v3.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --project Zedf9p.Tests/Zedf9p.Tests.csproj -c Release

      - name: Publish for the Raspberry Pi
        run: |
          for rid in linux-arm64 linux-arm; do
            dotnet publish Zedf9p/Zedf9p.csproj -c Release --self-contained -r "$rid" -o "publish/$rid"
            (cd "publish/$rid" && zip -r "../$rid.zip" .)
          done

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" publish/linux-arm64.zip publish/linux-arm.zip --clobber
